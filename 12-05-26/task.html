<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      overflow: hidden;
      background:
        radial-gradient(circle at top left, rgba(87, 255, 173, 0.2), transparent 320px),
        linear-gradient(135deg, #0e1720, #162d35);
      color: #f5fffb;
      font-family: Arial, sans-serif;
    }

    .box {
      width: min(94vw, 430px);
      padding: 18px;
      border: 1px solid rgba(87, 255, 173, 0.35);
      border-radius: 18px;
      background: rgba(17, 35, 42, 0.92);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      color: #57ffad;
      font-size: 30px;
    }

    #score {
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      background: #0d1b1f;
      font-size: 18px;
      font-weight: bold;
      white-space: nowrap;
    }

    canvas {
      width: min(100%, 52vh, 380px);
      height: auto;
      aspect-ratio: 1;
      display: block;
      margin: auto;
      background: #111;
      border: 3px solid #57ffad;
      border-radius: 14px;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.45);
    }

    #gameOver {
      display: none;
      margin: 12px;
      color: #ff5770;
      font-size: 28px;
      font-weight: bold;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      min-width: 120px;
      height: 42px;
      border: 0;
      border-radius: 999px;
      background: #57ffad;
      cursor: pointer;
      color: #07100c;
      font-size: 16px;
      font-weight: bold;
    }

    button:hover { background: white; }
  </style>
</head>
<body>
  <div class="box">
    <div class="top">
      <h1>Snake</h1>
      <div id="score">Score: 0</div>
    </div>

    <canvas id="game" width="400" height="400"></canvas>
    <div id="gameOver">Game Over</div>

    <div class="buttons">
      <button onclick="togglePause()" id="pauseBtn">Pause</button>
      <button onclick="restart()">Restart</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreText = document.getElementById("score");
    const gameOverText = document.getElementById("gameOver");
    const pauseBtn = document.getElementById("pauseBtn");
    const size = 20;
    const tiles = canvas.width / size;

    let snake, food, dx, dy, score, timer, paused;

    function restart() {
      snake = [{ x: 10, y: 10 }];
      food = randomFood();
      dx = 1;
      dy = 0;
      score = 0;
      paused = false;
      scoreText.textContent = "Score: 0";
      gameOverText.style.display = "none";
      pauseBtn.textContent = "Pause";
      clearInterval(timer);
      timer = setInterval(draw, 120);
    }

    function togglePause() {
      paused = !paused;
      pauseBtn.textContent = paused ? "Resume" : "Pause";
    }

    function randomFood() {
      return {
        x: Math.floor(Math.random() * tiles),
        y: Math.floor(Math.random() * tiles)
      };
    }

    document.addEventListener("keydown", (e) => {
      if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(e.key)) {
        e.preventDefault();
      }

      if (e.key === "ArrowLeft") turn(-1, 0);
      if (e.key === "ArrowRight") turn(1, 0);
      if (e.key === "ArrowUp") turn(0, -1);
      if (e.key === "ArrowDown") turn(0, 1);
      if (e.key === " ") togglePause();
    });

    function turn(x, y) {
      if (x && dx !== -x) [dx, dy] = [x, y];
      if (y && dy !== -y) [dx, dy] = [x, y];
    }

    function draw() {
      if (paused) return;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      if (
        head.x < 0 || head.y < 0 ||
        head.x >= tiles || head.y >= tiles ||
        snake.some(part => part.x === head.x && part.y === head.y)
      ) {
        clearInterval(timer);
        gameOverText.style.display = "block";
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreText.textContent = "Score: " + score;
        food = randomFood();
      } else {
        snake.pop();
      }

      ctx.fillStyle = "#111";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      drawGrid();

      ctx.fillStyle = "#ff5770";
      ctx.fillRect(food.x * size, food.y * size, size, size);

      ctx.fillStyle = "#57ffad";
      snake.forEach(part => {
        ctx.fillRect(part.x * size, part.y * size, size - 2, size - 2);
      });
    }

    function drawGrid() {
      ctx.strokeStyle = "#263437";

      for (let i = 0; i <= canvas.width; i += size) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }
    }

    restart();
  </script>
</body>
</html>
